[package]
name = "slot-achievements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RetroAchievements evaluation for slot.advance, on rcheevos (vendored, MIT)"
links = "rcheevos"

[features]
# Server answers shaped like retroachievements.org's, for other crates' tests.
test-support = []

[dependencies]
libc.workspace = true
slot-retro = { path = "../slot-retro" }
slot-store = { path = "../slot-store" }

[dev-dependencies]

[build-dependencies]
cc = "1"

# Runs on the main thread with no harness, so allocator statistics are exact.
[[test]]
name = "no_alloc"
harness = false
