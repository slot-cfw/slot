{% extends "main.html" %}
{% block content %}
{% include "partials/device.svg" %}
<div class="guide">
  <h1 class="sr-only">Tour</h1>
  <div class="guide-stage">
      <div class="device pose-flat">
        <div class="dv-lid">
          <div class="dv-front">
            <svg viewBox="0 0 820 725" role="img" aria-label="An Anbernic RG SP, straight on.">
              <use href="#lidArt"/>
            </svg>
            <video class="screen-box guide-screen" width="720" height="480" muted playsinline preload="none"></video>
          </div>
          <div class="dv-back" aria-hidden="true">
            <svg viewBox="0 0 820 725" preserveAspectRatio="none"><use href="#lidBackArt"/></svg>
          </div>
        </div>
        <div class="dv-deck">
          <svg viewBox="0 725 820 830" aria-hidden="true" focusable="false">
            <use href="#deckArt"/>
          </svg>
          <span class="dv-ao" aria-hidden="true"></span>
        </div>
      </div>
  </div>
  <script>{% include "partials/device-depth.js" %}</script>
  <div class="guide-body">
  <div class="guide-steps">
  {{ page.content }}
  </div>
  <div class="stepper">
    <button class="step-nav" type="button" id="step-prev" aria-label="Previous step">&#8592;</button>
    <p class="step-count" aria-live="polite"><span id="step-at">1</span> of <span id="step-of">6</span></p>
    <button class="step-nav" type="button" id="step-next" aria-label="Next step">&#8594;</button>
  </div>
  </div>
</div>
{% endblock %}
